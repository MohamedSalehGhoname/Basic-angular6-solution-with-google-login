<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root {
        --bg: #191d23;
        --surface: #21262e;
        --hover: #2c333d;
        --text: #e8ebf0;
        --muted: #a3adba;
        --border: #2a3038;
        --accent: #6b93ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      header {
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      #search {
        width: 100%;
        padding: 7px 9px;
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
      }
      #search:focus { border-color: var(--accent); }
      #list { flex: 1; overflow-y: auto; padding: 4px; }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .item.sel { background: var(--hover); }
      .item .txt {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item img {
        height: 32px;
        max-width: 80px;
        object-fit: contain;
        border-radius: 4px;
        border: 1px solid var(--border);
      }
      .empty { padding: 24px 14px; text-align: center; color: var(--muted); }
      .hint { padding: 6px 10px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <header><input id="search" type="text" placeholder="Search clipboard…" autofocus /></header>
    <div id="list"></div>
    <div class="hint">↑↓ to move · Enter to copy · Esc to close</div>
    <script>
      let items = [];
      let filtered = [];
      let sel = 0;
      const listEl = document.getElementById('list');
      const searchEl = document.getElementById('search');

      function render() {
        const q = searchEl.value.trim().toLowerCase();
        filtered = q
          ? items.filter((i) => i.kind === 'text' && i.preview.toLowerCase().includes(q))
          : items;
        if (sel >= filtered.length) sel = Math.max(0, filtered.length - 1);
        if (filtered.length === 0) {
          listEl.innerHTML =
            '<div class="empty">' +
            (items.length === 0 ? 'Unlock Clipboard Sync to see your items.' : 'No matches.') +
            '</div>';
          return;
        }
        listEl.innerHTML = '';
        filtered.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'item' + (idx === sel ? ' sel' : '');
          if (item.kind === 'image') {
            const img = document.createElement('img');
            img.src = item.preview;
            row.appendChild(img);
            const label = document.createElement('span');
            label.className = 'txt';
            label.textContent = 'Image';
            row.appendChild(label);
          } else {
            const span = document.createElement('span');
            span.className = 'txt';
            span.textContent = item.preview;
            row.appendChild(span);
          }
          row.addEventListener('click', () => choose(idx));
          listEl.appendChild(row);
        });
        const selEl = listEl.children[sel];
        if (selEl && selEl.scrollIntoView) selEl.scrollIntoView({ block: 'nearest' });
      }

      function choose(idx) {
        const item = filtered[idx];
        if (item) window.picker.pick(item.id);
      }

      searchEl.addEventListener('input', () => { sel = 0; render(); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, filtered.length - 1); render(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
        else if (e.key === 'Enter') { choose(sel); e.preventDefault(); }
        else if (e.key === 'Escape') { window.picker.close(); }
      });

      window.picker.onItems((next) => {
        items = next || [];
        sel = 0;
        searchEl.value = '';
        render();
        searchEl.focus();
      });
      render();
    </script>
  </body>
</html>
