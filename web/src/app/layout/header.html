<header>
  <div class="left">
    <a routerLink="/" class="brand">Clipboard Sync</a>
    @if (vault.status() === 'unlocked') {
      <nav>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Clipboard
        </a>
        <a routerLink="/secrets" routerLinkActive="active">Secrets</a>
      </nav>
    }
  </div>

  @if (auth.user(); as user) {
    <div class="user">
      @if (user.photoURL) {
        <img [src]="user.photoURL" [alt]="user.displayName ?? 'User avatar'" referrerpolicy="no-referrer" />
      } @else {
        <span class="avatar-fallback">{{ (user.displayName ?? user.email ?? '?').charAt(0).toUpperCase() }}</span>
      }
      <span class="name">{{ user.displayName ?? user.email }}</span>
      @if (vault.status() === 'unlocked') {
        <button type="button" (click)="lockVault()">Lock</button>
      }
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  }
</header>
