<header>
  <div class="left">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true">⧉</span>
      Clipboard Sync
    </a>
    @if (vault.status() === 'unlocked') {
      <nav aria-label="Sections">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Clipboard
        </a>
        <a routerLink="/secrets" routerLinkActive="active">Secrets</a>
      </nav>
    }
  </div>

  <div class="right">
    <button
      type="button"
      class="icon-btn"
      (click)="theme.cycle()"
      [attr.aria-label]="themeLabel()"
      [title]="themeLabel()"
    >
      {{ themeIcon() }}
    </button>

    @if (auth.user(); as user) {
      <div class="user">
        @if (user.photoURL) {
          <img
            class="avatar"
            [src]="user.photoURL"
            [alt]="user.displayName ?? 'User avatar'"
            referrerpolicy="no-referrer"
          />
        } @else {
          <span class="avatar avatar-fallback" aria-hidden="true">
            {{ (user.displayName ?? user.email ?? '?').charAt(0).toUpperCase() }}
          </span>
        }
        <span class="name">{{ user.displayName ?? user.email }}</span>
        @if (vault.status() === 'unlocked') {
          <button type="button" class="btn-ghost" (click)="lockVault()">Lock</button>
        }
        <button type="button" class="btn-ghost" (click)="signOut()">Sign out</button>
      </div>
    }
  </div>
</header>
